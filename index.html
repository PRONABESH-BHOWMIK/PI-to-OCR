<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI OCR &amp; Description Tool</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  button, #dl { padding: .5rem 1.25rem; }
  #dl { display: inline-block; border: 1px solid currentColor; border-radius: 4px; text-decoration: none; color: inherit; }
  textarea { width: 100%; height: 14rem; font-family: monospace; box-sizing: border-box; }
  #pdf { width: 100%; height: 75vh; border: 1px solid #8886; }
  #status { margin: 1rem 0; opacity: .75; }
</style>
</head>
<body>
<h1>PI OCR &amp; Product Description</h1>
<p>Upload a Proforma Invoice (PDF or image, Bangla or English). You get a searchable, copyable PDF and the item lines in your format. OCR runs in your browser; only the extracted text is sent to the AI.</p>

<input id="files" type="file" multiple accept=".pdf,image/*">
<button id="go">Process PI</button>
<div id="status"></div>
<textarea id="out" readonly placeholder="Formatted item lines appear here"></textarea>
<p><a id="dl" hidden>Download searchable PDF</a></p>
<!-- shortcut: uses the browser's built-in PDF viewer (select/copy works); phones may not render it, upgrade to a pdf.js text layer if mobile matters -->
<iframe id="pdf" title="OCR'd PI" hidden></iframe>
<details><summary>Extracted text</summary><textarea id="txt" readonly></textarea></details>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="format.js"></script>
<script src="enhance.js"></script>
<script>
const MAX_PAGES = 30; // shortcut: browser memory limit, raise if your PIs are longer and your PC copes
const $ = (id) => document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

// Same settings as the notebook.
const LONG_MAX = 2200, LONG_MIN = 1650, CONTRAST = 1.3, JPEG_QUALITY = 0.85;

// Resize so the long side is within [LONG_MIN, LONG_MAX], grayscale + contrast, re-encode as JPEG.
async function prep(source) {
  const bmp = source instanceof Blob ? await createImageBitmap(source) : source;
  const long = Math.max(bmp.width, bmp.height);
  const k = long > LONG_MAX ? LONG_MAX / long : long < LONG_MIN ? LONG_MIN / long : 1;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#fff'; // transparent PNGs would otherwise turn black
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height);
  enhance(img.data, CONTRAST);
  ctx.putImageData(img, 0, 0);
  return new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', JPEG_QUALITY));
}

// Yields one image-like input per page: a canvas for PDF pages, the file itself for images.
async function* pagesOf(file) {
  if (!/\.pdf$/i.test(file.name)) { yield file; return; }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const viewport = page.getViewport({ scale: 200 / 72 }); // 200 DPI, as in the notebook
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    yield canvas;
  }
}

$('go').onclick = async () => {
  const files = [...$('files').files];
  if (!files.length) return;
  $('go').disabled = true;
  $('out').value = '';
  $('txt').value = '';
  $('dl').hidden = true;
  $('pdf').hidden = true;
  const parts = [], texts = [];
  let worker;
  try {
    $('status').textContent = 'Loading OCR engine (first run downloads Bangla + English data)...';
    worker = await Tesseract.createWorker('ben+eng');
    let n = 0;
    for (const f of files) {
      for await (const page of pagesOf(f)) {
        if (++n > MAX_PAGES) throw new Error(`Over the ${MAX_PAGES}-page limit`);
        $('status').textContent = `OCR page ${n}...`;
        const { data } = await worker.recognize(await prep(page), { pdfTitle: 'PI' }, { pdf: true });
        parts.push(new Uint8Array(data.pdf));
        texts.push(data.text);
      }
    }

    const merged = await PDFLib.PDFDocument.create();
    for (const bytes of parts) {
      const doc = await PDFLib.PDFDocument.load(bytes);
      (await merged.copyPages(doc, doc.getPageIndices())).forEach((p) => merged.addPage(p));
    }
    const url = URL.createObjectURL(new Blob([await merged.save()], { type: 'application/pdf' }));
    $('dl').href = url;
    $('dl').download = 'pi_searchable.pdf';
    $('dl').hidden = false;
    $('pdf').src = url;
    $('pdf').hidden = false;
    $('txt').value = texts.join('\n\n');

    $('status').textContent = 'Asking AI...';
    const r = await fetch('/api/describe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: texts.join('\n\n') }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'AI step failed');
    $('out').value = j.items?.length ? formatItems(j.items) : 'No line items found in this PI.';
    $('status').textContent = 'Done.';
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message + (parts.length ? ' (the searchable PDF above is still usable)' : '');
  } finally {
    if (worker) await worker.terminate();
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
